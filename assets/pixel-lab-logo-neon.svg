  <title id="logo-title">Pixel Lab — Neon</title>
  <desc id="logo-description">Pixel Lab Neon logo in custom heavier Press Start 2P lettering. PIXEL has tangerine, electric cyan, coral, lime, and violet faces. The hyphen and LAB are hot pink. Three saturated, hue-shifted shadow bands provide depth. Letter positions are manually balanced. The background is transparent.</desc>
