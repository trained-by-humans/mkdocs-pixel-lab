name: CI

run-name: "CI: ${{ github.event.pull_request.title || github.head_ref || github.ref_name }}"

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'tests/docs/**'
      - 'mkdocs.yml'
      - '.github/CONTRIBUTING.md'
      - 'RELEASING.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'tests/docs/**'
      - 'mkdocs.yml'
      - '.github/CONTRIBUTING.md'
      - 'RELEASING.md'
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: python -m pytest -q

  package:
    name: Build and validate distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build distribution artifacts
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Smoke-test the built wheel in a clean environment
        run: |
          python -m venv artifact-venv
          artifact-venv/bin/python -m pip install --upgrade pip
          wheel_path="$(find dist -name '*.whl' -print -quit)"
          artifact-venv/bin/python -m pip install "$wheel_path"
          artifact-venv/bin/python -m pip check
          artifact-venv/bin/python -I -c 'from pathlib import Path; import sys; import mkdocs_pixel_lab as package; assert Path(package.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())'
          artifact-venv/bin/mkdocs build --strict --config-file tests/fixture_site/mkdocs.yml
