site_name: Pixel Lab Fixture
site_description: Theme validation fixture.
site_url: https://example.invalid/
theme:
  name: pixel-lab
  footer_text: Fixture documentation
nav:
  - Home: index.md
  - Guide:
      - Overview: guide/nested.md
      - Media gallery: guide/media.md
plugins:
  - search
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
