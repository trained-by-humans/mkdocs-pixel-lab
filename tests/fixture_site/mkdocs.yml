site_name: Pixel Lab Fixture
site_description: Theme validation fixture.
site_url: https://example.invalid/
theme:
  name: pixel-lab
  footer_text: Fixture documentation
  border_color: "#123456"
  shadow_color: "#654321"
nav:
  - Home: index.md
  - Guide:
      - Overview: guide/nested.md
      - Media gallery: guide/media.md
      - Tab layouts: guide/tabs.md
      - Code highlighting: guide/code.md
      - Stacked lettering: guide/stacked-text.md
extra_javascript:
  - assets/stacked-text-preview.js
plugins:
  - search
markdown_extensions:
  - mkdocs_pixel_lab.github_alerts
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - md_in_html
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
